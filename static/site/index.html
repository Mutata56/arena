<!DOCTYPE html>
<html lang="ru" data-style="editorial" data-theme="light" data-size="m" data-width="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arena — Java по шагам</title>
  <link rel="stylesheet" href="/static/site/css/tokens.css">
  <link rel="stylesheet" href="/static/site/css/app.css">
  <link rel="stylesheet" href="/static/site/css/ide.css">
</head>
<body>
  <header class="top">
    <button class="iconbtn" id="btn-rail" title="ноды этапа" aria-label="ноды этапа">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a class="brand" href="#/map"><span class="dot"></span>arena <small data-brand-sub>Java по шагам</small></a>

    <div class="crumb">
      <span id="crumb-stage"></span>
      <span>·</span>
      <b id="crumb-node"></b>
      <span class="chip" id="genline" hidden></span>
    </div>

    <a class="stat" id="contract" href="#/review" title="контракт дня: вопросы и карточки"></a>
    <span class="stat">сегодня <b id="xp-today">0</b> XP</span>
    <span class="stat">всего <b id="xp-total">0</b></span>
    <span class="stat ok" hidden>серия <b id="streak">0</b></span>

    <button class="iconbtn" id="btn-gloss" title="глоссарий" aria-label="глоссарий">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5zM8 7.5h7M8 11h5"/></svg>
    </button>
    <button class="iconbtn" id="btn-notes" title="заметки" aria-label="заметки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v11l-5 5H4z"/><path d="M20 15h-5v5"/></svg>
    </button>
    <button class="iconbtn" id="btn-settings" title="настройки чтения" aria-label="настройки чтения">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
    </button>
  </header>

  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main id="view"></main>
    <aside class="aside" id="aside"></aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" aria-hidden="true">
    <header>
      <h3 id="sheet-title">Настройки</h3>
      <button class="iconbtn" id="sheet-close" aria-label="закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="body" id="sheet-body"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script type="module" src="/static/site/js/app.js"></script>
</body>
</html>
